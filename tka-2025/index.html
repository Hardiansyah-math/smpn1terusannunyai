{t:"pg",k:0,q:"Hasil dari operasi bilangan berpangkat berikut adalah …<div style='text-align:center;font-size:20px;margin:8px 0'>(7<sup>3</sup> × 7<sup>−4</sup>) ÷ 7<sup>2</sup></div>",o:["7<sup>−9</sup>","7<sup>−6</sup>","7<sup>−3</sup>","7"],a:2,e:"7<sup>3</sup> × 7<sup>−4</sup> = 7<sup>−1</sup>. Lalu 7<sup>−1</sup> ÷ 7<sup>2</sup> = 7<sup>(−1 − 2)</sup> = 7<sup>−3</sup>."},
{t:"pk",k:0,r:"r1",q:"Rina akan membeli hadiah untuk dua orang temannya. Hadiahnya akan dikirim ke alamat masing-masing sehingga Rina harus melakukan dua kali transaksi. Setiap satu kali transaksi, Rina dapat memilih satu voucher <i>cashback</i>. Setiap voucher hanya dapat digunakan satu kali. Hadiah yang dikirim harganya sama yaitu Rp50.000,00. Jika Rina menginginkan <i>cashback</i> lebih dari Rp10.000,00, voucher mana sajakah yang harus ia pilih?",o:["Voucher A","Voucher B","Voucher C","Voucher D"],a:[0,3],e:"Untuk Rp50.000: A = 25% × 50.000 = Rp12.500; B = 5% × 50.000 = Rp2.500; C = 10% × 50.000 = Rp5.000; D = 40% × 50.000 = Rp20.000 (tepat pada batas 20RB). Yang lebih dari Rp10.000 adalah A dan D."},
{t:"kat",k:0,r:"r1",q:"Rina memiliki voucher A, B, dan D yang bisa ia gunakan untuk berbelanja <i>online</i>. Tentukan benar atau salah pernyataan berikut ini berkaitan dengan nominal transaksi Rina dan voucher yang seharusnya ia gunakan untuk mendapatkan <i>cashback</i> terbesar!",s:["Untuk belanja Rp50.000, <i>cashback</i> terbesar diperoleh dengan Voucher D.","Untuk belanja Rp200.000, <i>cashback</i> terbesar diperoleh dengan Voucher B.","Untuk belanja Rp2.500.000, <i>cashback</i> terbesar diperoleh dengan Voucher A."],a:[true,false,false],e:"Rp50.000: A = 12.500, B = 2.500, D = 20.000 → D terbesar. Rp200.000: A = 50.000, B = 10.000, D = 20.000 (batas) → A terbesar, bukan B. Rp2.500.000: A = 100.000 (batas), B = 125.000, D = 20.000 (batas) → B terbesar, bukan A."},
{t:"pg",k:0,q:"Buah merupakan salah satu sumber vitamin C. Tim peneliti menguji kandungan vitamin C pada buah dengan ukuran dan kandungan air yang beragam.<table class='tb'><tr><th>Buah</th><th>Berat (gr)</th><th>Kandungan air (mL)</th></tr><tr><td>Buah A</td><td>118,4</td><td>96,3</td></tr><tr><td>Buah B</td><td>130,7</td><td>150</td></tr><tr><td>Buah C</td><td>130,55</td><td>140</td></tr><tr><td>Buah D</td><td>96,255</td><td>118,15</td></tr></table>Karena keterbatasan waktu pengujian, pada hari pertama hanya satu buah yang akan diteliti. Buah yang akan diteliti pertama adalah buah yang memiliki berat terbesar dan kandungan air paling banyak. Buah yang akan diteliti pertama adalah …",o:["Buah A","Buah B","Buah C","Buah D"],a:1,e:"Berat terbesar 130,7 gr (B) dan kandungan air paling banyak 150 mL (B). Jadi buah B."},
{t:"pg",k:0,q:"Gambar berikut menunjukkan berbagai suhu penyimpanan makanan di dalam lemari pendingin menurut Departemen Pertanian Amerika Serikat (FDA).<table class='tb'><tr><th>Makanan</th><th>Rekomendasi suhu</th></tr><tr><td>Daging Merah</td><td>≤ −18 °C</td></tr><tr><td>Makanan Laut</td><td>= −18 °C</td></tr><tr><td>Daging Unggas</td><td>= −19 °C</td></tr><tr><td>Buah &amp; Sayur</td><td>≤ 4 °C</td></tr></table>Berdasarkan saran FDA, berapa suhu lemari pendingin yang direkomendasikan untuk menyimpan daging ayam? (Daging ayam termasuk daging unggas.)",o:["18 derajat di bawah 0 °C","18 derajat di atas 0 °C","19 derajat di bawah 0 °C","19 derajat di atas 0 °C"],a:2,e:"Daging ayam adalah daging unggas. Suhu yang direkomendasikan untuk daging unggas adalah −19 °C, yaitu 19 derajat di bawah 0 °C."},
{t:"kat",k:1,q:"Diketahui bentuk aljabar 2ab − b<sup>2</sup> + 3a<sup>2</sup>b + ab<sup>2</sup> − 5. Tentukan benar atau salah tiap pernyataan.",s:["Terdapat 2 variabel yaitu a dan b.","Konstanta pada bentuk aljabar tersebut adalah 5.","Bilangan 2, −1, 3, dan 1 merupakan koefisien."],a:[true,false,true],e:"Variabelnya a dan b. Konstantanya −5, bukan 5. Koefisien suku-sukunya adalah 2, −1, 3, dan 1."},
{t:"kat",k:1,c:["Fungsi","Bukan fungsi"],q:"Perhatikan tiga diagram panah berikut dengan himpunan A = {5, 9, 13, 17} dan B = {p, q, r, s}.<div style='display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0'>"+ARR([[0,2],[1,0],[2,2],[3,3]],"Diagram 1")+ARR([[0,0],[1,1],[2,2],[2,3],[3,2]],"Diagram 2")+ARR([[0,0],[1,3],[2,2],[3,0]],"Diagram 3")+"</div>Tentukan fungsi atau bukan fungsi pada setiap diagram.",s:["Diagram 1","Diagram 2","Diagram 3"],a:[true,false,true],e:"Fungsi: setiap anggota A tepat satu pasangan di B. Diagram 1 fungsi (5→r, 9→p, 13→r, 17→s). Diagram 2 bukan fungsi karena anggota 13 memiliki dua pasangan (r dan s). Diagram 3 fungsi (5→p, 9→s, 13→r, 17→p)."},
{t:"kat",k:1,q:"Pembayaran air PDAM setiap rumah berbeda-beda tergantung banyaknya pemakaian air. Biaya pemasangan awal adalah Rp800.000,00. Tarif pemakaian air berdasarkan banyak air yang digunakan dengan pemasangan awal dapat dilihat pada grafik berikut.<div style='margin:8px 0'>"+PD()+"</div>Seseorang menghabiskan biaya Rp920.000,00 dalam 1 bulan pemakaian dengan pemasangan baru. Tentukan benar atau salah tiap pernyataan.",s:["Jumlah pemakaian air mencapai 60 m³.","Orang tersebut akan menghabiskan biaya sebesar Rp120.000,00 jika tanpa pemasangan baru.","Tarif dapat mencapai 1 juta jika pemakaian air kurang dari 90 m³ dengan pemasangan baru."],a:[true,true,false],e:"Grafik: biaya = 800.000 + 2.000 × pemakaian (m³). Biaya 920.000 berarti biaya pemakaian 120.000, sehingga pemakaian = 120.000 ÷ 2.000 = 60 m³. Tanpa pemasangan baru biayanya hanya 120.000. Agar mencapai 1 juta diperlukan pemakaian (1.000.000 − 800.000) ÷ 2.000 = 100 m³, bukan kurang dari 90 m³."},
{t:"kat",k:1,c:["Bisa ditanami pohon mangga","Tidak bisa ditanami pohon mangga"],q:"Ayunda mulai memanfaatkan lahan kosong di pekarangan rumahnya untuk menanam berbagai jenis tanaman. Berikut adalah peta pekarangan rumah Ayunda (sketsa). Ayunda hanya akan menanam pohon mangga di lokasi 1, 3, dan 4, dan hanya pada lahan yang masih kosong (belum ada tanaman lain) di lokasi tersebut.<div style='margin:8px 0'>"+MAP()+"</div>Tentukan “Bisa ditanami pohon mangga” atau “Tidak bisa ditanami pohon mangga” untuk beberapa koordinat berikut.",s:["(9, −2)","(−2, 9)","(−9, −9)"],a:[true,false,true],e:"(9, −2) berada di Lokasi 4 (kanan bawah) pada lahan kosong. (−2, 9) berada di Lokasi 2 (kiri atas) yang tidak termasuk lokasi penanaman. (−9, −9) berada di Lokasi 3 (kiri bawah) pada lahan kosong di sudut kiri bawah; bedeng tanaman berada di atas dan di kanannya."},
{t:"pg",k:1,q:"Diketahui pertidaksamaan 3x + 17 ≤ 7 − 2x. Manakah garis bilangan yang menunjukkan himpunan penyelesaian dari pertidaksamaan tersebut?",o:[NL2(-2,true,-1,-5,5),NL2(-10,false,-1,-15,-5),NL2(-2,false,-1,-5,5),NL2(-2,true,1,-5,5)],a:0,e:"3x + 2x ≤ 7 − 17 sehingga 5x ≤ −10 dan x ≤ −2. Titik penuh pada −2 dan arah ke kiri."},
{t:"pg",k:1,q:"Harga jajanan tradisional kue putu mayang (kotak hijau) dan kue pancong (kotak merah) di sebuah bazar: tumpukan seharga Rp58.000 berisi 3 kotak putu mayang dan 2 kotak pancong; tumpukan seharga Rp62.000 berisi 2 kotak putu mayang dan 3 kotak pancong. Berapa harga 3 kotak kue putu mayang dan 1 kotak kue pancong?",o:["Rp10.000,00.","Rp14.000,00.","Rp44.000,00.","Rp52.000,00."],a:2,e:"Misal putu mayang = p dan pancong = q: 3p + 2q = 58.000 dan 2p + 3q = 62.000. Jumlah keduanya: 5p + 5q = 120.000, jadi p + q = 24.000. Selisihnya: q − p = 4.000, sehingga q = 14.000 dan p = 10.000. Maka 3p + q = 30.000 + 14.000 = Rp44.000."},
{t:"pg",k:1,q:"Rino membeli 4 buah buku tulis dan 3 buah pulpen. Tiko membeli dua kali lipat dari masing-masing jumlah buku dan pulpen yang dibeli oleh Rino. Bayu membeli tiga kali lipat dari masing-masing jumlah buku dan pulpen yang dibeli oleh Rino. Apabila harga 1 buku tulis disimbolkan dengan “x” dan harga 1 pulpen disimbolkan dengan “y”, bagaimana kalimat matematika yang menyatakan total harga yang harus dibayar oleh ketiga anak tersebut?",o:["24x + 18y","20x + 15y","12x + 9y","4x + 3y"],a:0,e:"Rino 4x + 3y, Tiko 8x + 6y, Bayu 12x + 9y. Jumlahnya 24x + 18y."},
{t:"pg",k:1,q:"Naura menggunakan operator seluler “Nusantara Mobile”. Naura menuliskan pilihan paket kuota yang tersedia dan harganya dalam bentuk himpunan pasangan berurutan (paket kuota internet dalam GB, harga dalam rupiah) sebagai berikut: {(5, 14.000), (10, 23.000), (20, 41.000), (25, 50.000)}. Jika x adalah paket kuota internet dalam GB, rumus fungsi f(x) yang menyatakan harga paket kuota internet adalah …",o:["f(x) = 2.000x + 4.000","f(x) = 2.000x + 1.000","f(x) = 1.800x + 9.000","f(x) = 1.800x + 5.000"],a:3,e:"Kenaikan harga tiap 5 GB adalah 9.000, sehingga gradiennya 1.800 per GB. f(x) = 1.800x + b; dari f(5) = 14.000 diperoleh b = 5.000. Periksa: f(10) = 23.000, f(20) = 41.000, f(25) = 50.000."},
{t:"pg",k:1,r:"r2",q:"Jika ingin dibuat pagar dengan 10 tingkat susunan batu bata, berapakah jumlah total batu bata (segitiga maupun persegi panjang) yang ada pada tingkat ke-10 dari pagar tersebut?",o:["10 batu bata","11 batu bata","20 batu bata","21 batu bata"],a:3,e:"Tingkat n memakai n batu bata segitiga dan n + 1 batu bata persegi panjang. Pada tingkat ke-10: 10 + 11 = 21 batu bata."},
{t:"kat",k:1,r:"r2",q:"Dua pagar yang sama persis dengan masing-masing memiliki 9 tingkat akan dibangun. Tetapi hanya ada persediaan sebanyak 60 batu bata segitiga dan 80 batu bata persegi panjang. Apakah jumlah kedua jenis batu bata tersebut cukup untuk membuat kedua pagar? Tentukan benar atau salah tiap pernyataan.",s:["Diperlukan tambahan 15 batu bata segitiga.","Diperlukan tambahan 28 batu bata persegi panjang.","Diperlukan tambahan total sebanyak 43 batu bata baik segitiga maupun persegi panjang."],a:[false,true,false],e:"Segitiga per pagar 1 + 2 + … + 9 = 45, dua pagar 90 (kurang 30, bukan 15). Persegi panjang per pagar 2 + 3 + … + 10 = 54, dua pagar 108 (kurang 28). Total tambahan 30 + 28 = 58, bukan 43."},
{t:"pg",k:2,q:"Garis AB dan garis PQ berpotongan di titik Q seperti gambar berikut.<div style='margin:8px 0'>"+SV1+"</div>Nilai x yang tepat adalah …",o:["15°","24°","69°","96°"],a:1,e:"Sudut 72° dan sudut (4x + 12)° saling berpelurus karena membentuk garis lurus, sehingga jumlahnya 180°. 72 + 4x + 12 = 180 → 4x = 96 → x = 24."},
{t:"pg",k:2,q:"Perhatikan gambar jaring-jaring prisma segitiga berikut.<div style='margin:8px 0'>"+NET+"</div>Sisi tutup pada prisma tersebut adalah sisi ABC. Rusuk AC pada sisi tutup akan berhimpit dengan salah satu rusuk pada sisi tegak prisma nomor …",o:["1","2","3","4"],a:2,e:"Tutup ABC kongruen dengan alas segitiga ②. Rusuk AC bersesuaian dengan rusuk alas yang menempel pada sisi tegak nomor 3, sehingga ketika prisma dilipat, rusuk AC berhimpit dengan rusuk sisi tegak nomor 3 (biru)."},
{t:"pg",k:2,q:"Perhatikan gambar berikut ini!<div style='margin:8px 0'>"+PAR+"</div>Berdasarkan gambar tersebut, berapa nilai b?",o:["46","68","112","134"],a:3,e:"Garis p dan q sejajar. Sudut 46° di ujung kanan memiliki sudut sehadap yang berpelurus dengan sudut b, sehingga b = 180° − 46° = 134°. Sudut 68° adalah sudut dalam segitiga, bukan yang ditanyakan."},
{t:"pg",k:2,q:"Pak Anton baru saja membangun rumah. Ada beberapa bagian dalam rumahnya yang belum terpasang. Salah satunya adalah pagar tangga. Pagar tangga berfungsi untuk pegangan saat naik maupun turun tangga. Berikut adalah gambar tangga Pak Anton.<div style='margin:8px 0'>"+STAIR+"</div>Gambar garis putus-putus merupakan rancangan pagar tangga. Setiap anak tangga memiliki tinggi yang sama yaitu 25 cm. Suatu hari, Pak Anton ke toko untuk membeli bahan pagar tangga. Tersedia 4 jenis bahan pagar tangga yakni: pagar bahan kayu jati sepanjang 6 meter, pagar bahan kayu meranti sepanjang 4 meter, pagar bahan besi sepanjang 5,5 meter, dan pagar bahan aluminium sepanjang 4,5 meter. Jenis bahan apa yang harus dipilih Pak Anton agar cukup untuk membuat pagar tangga dan memiliki sisa paling sedikit?",o:["Pagar kayu jati","Pagar kayu meranti","Pagar besi","Pagar aluminium"],a:1,e:"Tangga memiliki 8 anak tangga, masing-masing 25 cm, sehingga tinggi total 8 × 25 = 200 cm = 2 m. Jarak mendatar 150 cm = 1,5 m. Panjang pagar (garis miring) = √(1,5² + 2²) = √6,25 = 2,5 m. Keempat bahan cukup, tetapi sisa paling sedikit dimiliki kayu meranti 4 m (sisa 1,5 m)."},
{t:"pg",k:2,q:"Perhatikan dua segitiga kongruen pada koordinat kartesius berikut.<div style='margin:8px 0'>"+TRI+"</div>Diketahui titik Q = titik K. Segitiga PQR akan ditranslasikan oleh T = (−4, −2). Bayangan segitiga PQR dan segitiga KLM akan saling …",o:["tegak lurus","berpotongan","sejajar","berhimpit"],a:2,e:"Translasi hanya menggeser segitiga tanpa mengubah bentuk dan arah sisinya. Bayangan PQR tetap kongruen dan sisi-sisinya sejajar dengan sisi-sisi KLM, sehingga kedudukan kedua segitiga itu sejajar."},
{t:"pg",k:2,q:"Perhatikan gambar juring pada lingkaran di bawah ini!<div style='margin:8px 0'>"+SEC+"</div>Manakah pernyataan yang benar di bawah ini terkait luas juring A, B, dan C?",o:["Luas juring B dua kali dari luas juring C.","Luas juring C setengah dari luas juring A.","Luas juring A tiga kali dari luas juring B.","Luas juring B dua kali dari luas juring A."],a:1,e:"Juring A = 70°, juring B = 90° (tanda siku-siku), juring C = 35°. Luas juring sebanding dengan sudut pusatnya. C = 35° = 70° ÷ 2, jadi luas juring C setengah dari luas juring A."},
{t:"pg",k:2,q:"Perhatikan dua persegi panjang berikut.<div style='margin:8px 0'>"+RECT+"</div>Diketahui luas persegi panjang yang lebih besar adalah 320 cm² dan kedua persegi panjang tersebut sebangun. Berapakah keliling persegi panjang yang lebih kecil?",o:["9 cm","18 cm","20 cm","72 cm"],a:1,e:"Persegi panjang besar tingginya 20 cm, yang kecil 5 cm, sehingga perbandingan linearnya 20 : 5 = 4 : 1. Luas yang kecil = 320 ÷ 4² = 20 cm². Lebar yang kecil = 20 ÷ 5 = 4 cm. Keliling yang kecil = 2 × (5 + 4) = 18 cm."},
{t:"pk",k:2,r:"r3",q:"Minyak jenis B pada tangki yang berisi penuh akan dikemas di botol dan di jeriken. Sebanyak 300 botol berukuran 2 liter sudah diisi minyak curah jenis B dari tangki tersebut. Sisa minyak akan dikemas ke dalam jeriken berukuran 5 liter. Bagaimana perbandingan banyak kemasan botol dan jeriken? Pilihlah semua jawaban benar! Jawaban benar lebih dari satu.",o:["Jumlah kemasan botol lebih banyak daripada jeriken.","Total kemasan botol dan jeriken yang terisi adalah 532.","Sisa minyak di tangki cukup untuk mengisi 1 kemasan botol.","Banyak kemasan jeriken yang terisi minyak adalah 332."],a:[0,1],e:"Volume tangki B = 8 dm × 2,2 m × 1 m = 0,8 × 2,2 × 1 = 1,76 m³ = 1.760 liter. 300 botol × 2 liter = 600 liter; sisa 1.760 − 600 = 1.160 liter = 232 jeriken × 5 liter (pas, tanpa sisa). Botol (300) lebih banyak dari jeriken (232), dan total kemasan 300 + 232 = 532. Sisa minyak sudah habis, jadi tidak cukup untuk 1 botol pun."},
{t:"kat",k:2,r:"r3",c:["Mungkin","Tidak Mungkin"],q:"Hari ini di toko Pak Dodi kedatangan dua pelanggan minyak curah yakni Pak Angga dan Bu Susi. Pak Angga membawa jeriken berukuran 25 liter, Bu Susi berukuran 30 liter. Pak Dodi memiliki persediaan 1 tangki minyak jenis A dan 1 tangki minyak jenis B. Pak Angga dan Bu Susi membeli seluruh minyak tersebut sehingga tidak ada lagi sisa minyak di tangki. Seluruh jeriken yang dibawa berisi penuh dan masing-masing mendapatkan kedua jenis minyak. Bagaimana kemungkinan perbandingan banyaknya jeriken Pak Angga dan Bu Susi? Tentukan Mungkin atau Tidak Mungkin pada setiap pernyataan berikut!",s:["Bu Susi membawa pulang sebanyak 32 jeriken minyak jenis A dan 22 jeriken minyak jenis B.","Pak Angga membawa pulang minyak 24 jeriken minyak jenis A dan 44 jeriken minyak jenis B.","Bu Susi membawa pulang 21 jeriken minyak jenis A dan Pak Angga membawa 40 jeriken minyak jenis B."],a:[false,true,false],e:"Volume tangki A = 6 dm × 2 m × 0,8 m = 0,6 × 2 × 0,8 = 0,96 m³ = 960 liter; tangki B = 1.760 liter. (1) Susi 32 × 30 = 960 liter jenis A, habis seluruh tangki A, sehingga Angga tidak mendapat jenis A — tidak mungkin. (2) Angga 24 × 25 = 600 liter A dan 44 × 25 = 1.100 liter B; Susi mendapat A 960 − 600 = 360 liter = 12 jeriken dan B 1.760 − 1.100 = 660 liter = 22 jeriken — mungkin. (3) Susi 21 × 30 = 630 liter A, sisa A untuk Angga 960 − 630 = 330 liter, tidak habis dibagi 25 — tidak mungkin."},
{t:"pg",k:3,q:"Karet dan kelapa sangat penting bagi banyak industri di dunia, mulai dari ban hingga makanan. Indonesia adalah penghasil utama keduanya. Berikut adalah data produksi karet dan kelapa di Indonesia (dalam juta ton).<table class='tb'><tr><th>Tahun</th><th>2018</th><th>2019</th><th>2020</th><th>2021</th><th>2022</th><th>2023</th><th>2024</th></tr><tr><td>Karet</td><td>3,68</td><td>3,50</td><td>3,30</td><td>3,12</td><td>2,95</td><td>2,75</td><td>2,60</td></tr><tr><td>Kelapa</td><td>2,83</td><td>2,83</td><td>2,81</td><td>2,85</td><td>2,86</td><td>2,90</td><td>2,89</td></tr></table>Berdasarkan data di atas, diagram garis manakah yang menunjukkan penyajian data dari salah satu hasil produksi karet atau kelapa di Indonesia?",o:["<div>"+LC([6.51,6.33,6.11,5.97,5.81,5.65,5.49],5.4,6.6)+"</div>","<div>"+LC([6.5,5.5,5.7,5.85,6.0,6.15,6.35],5.4,6.6)+"</div>","<div>"+LC([2.83,2.89,2.91,2.86,2.85,2.81,2.83],2.8,2.92)+"</div>","<div>"+LC([3.68,3.5,3.3,3.12,2.95,2.75,2.6],0,4)+"</div>"],a:3,e:"Produksi karet 2018–2024: 3,68; 3,50; 3,30; 3,12; 2,95; 2,75; 2,60 — selalu menurun. Diagram D menunjukkan penurunan yang sama. Diagram A menjumlahkan karet dan kelapa; B dan C tidak cocok dengan data kelapa (2,83; 2,83; 2,81; 2,85; 2,86; 2,90; 2,89)."},
{t:"pg",k:3,q:"Tory suka sekali bermain game online. Dia selalu mengabaikan batas waktu dalam bermain game online. Belakangan ini Tory sering merasa gelisah dan mudah marah apabila tidak diizinkan bermain. Dia juga sering merasakan sakit mata dan pusing. Dokter mengatakan bahwa Tory telah kecanduan bermain game online. Tory harus berusaha perlahan-lahan mengontrol waktu bermainnya. Dokter mengatakan bahwa batas waktu maksimal Tory diperbolehkan bermain adalah 7 jam dalam satu minggu. Selama 12 minggu, waktu bermain game Tory terus dipantau oleh kedua orang tuanya dan dilaporkan ke dokter.<div style='margin:8px 0'>"+BC12()+"</div>Dalam 12 minggu terakhir, Tory paling sering menghabiskan waktu untuk bermain game online setiap minggunya yaitu selama …",o:["10 jam","14 jam","20 jam","22 jam"],a:1,e:"Dari diagram batang 12 minggu: 22, 20, 18, 20, 14, 16, 14, 14, 12, 10, 14, 12. Nilai 14 jam muncul 4 kali, paling sering dibanding nilai lain — modusnya 14 jam."},
{t:"pk",k:3,q:"Tory kecanduan bermain game online dan waktu bermainnya dipantau selama 12 minggu oleh orang tuanya. Dokter membuat skema pemantauan sebagai berikut.<div style='margin:8px 0'>"+BC12()+"</div>Dokter memantau dan membandingkan rata-rata jam bermain game online setiap 4 minggu dan menyebutnya sebagai fase. Fase pertama membandingkan rata-rata jam bermain pada 4 minggu pertama dengan rata-rata jam bermain pada 4 minggu kedua. Fase kedua membandingkan rata-rata jam bermain pada 4 minggu kedua dengan rata-rata jam bermain pada 4 minggu ketiga. Fase akhir membandingkan rata-rata jam bermain pada 4 minggu ketiga dengan batas waktu maksimal yang disarankan (7 jam). Apakah yang terjadi pada Tory selama fase penyembuhan? Pilihlah semua jawaban benar! Jawaban benar lebih dari satu.",o:["Fase pertama berkurang 5,5 jam.","Fase kedua berkurang 2,25 jam.","Fase akhir berkurang 5,25 jam.","Fase penyembuhan berkurang 8 jam."],a:[0,3],e:"Rata-rata 4 minggu pertama = (22 + 20 + 18 + 20) ÷ 4 = 20 jam; minggu 5–8 = (14 + 16 + 14 + 14) ÷ 4 = 14,5 jam; minggu 9–12 = (12 + 10 + 14 + 12) ÷ 4 = 12 jam. Fase pertama berkurang 20 − 14,5 = 5,5 jam. Fase kedua berkurang 14,5 − 12 = 2,5 jam (bukan 2,25). Fase akhir berkurang 12 − 7 = 5 jam (bukan 5,25). Fase penyembuhan (awal ke akhir) berkurang 20 − 12 = 8 jam."},
{t:"pg",k:3,q:"Suatu paket terdiri dari 20 kotak misteri berisi patung figur karakter Saka dan Kirana. Banyak figur dalam satu paket: Saka 8 kotak, Kirana 12 kotak. Riana mengambil 3 kotak misteri secara acak dari dalam paket tersebut dan ternyata ia mendapatkan 1 buah Saka dan 2 buah Kirana. Kemudian, Santi akan mengambil 1 kotak misteri. Berapakah peluang Santi mendapatkan Saka?",o:["7/20","8/20","8/17","7/17"],a:3,e:"Setelah Riana mengambil, tersisa 20 − 3 = 17 kotak, dengan Saka tersisa 8 − 1 = 7. Peluang Santi mendapat Saka = 7/17."},
{t:"pg",k:3,q:"Mesin tetas telur adalah sebuah alat yang digunakan untuk membantu proses penetasan telur. Penetasan berlangsung selama 18 hari terhitung dari awal masuknya telur ke dalam mesin tetas. Dilakukan pengamatan terhadap beberapa telur puyuh dengan usia yang berbeda-beda. Berikut rincian usia telur di mesin tetas tersebut saat ini.<table class='tb'><tr><th>Usia telur di dalam mesin</th><th>Banyak telur</th></tr><tr><td>2 hari</td><td>20</td></tr><tr><td>4 hari</td><td>35</td></tr><tr><td>6 hari</td><td>30</td></tr><tr><td>8 hari</td><td>15</td></tr></table>Diketahui telur-telur tersebut diletakkan secara acak di dalam mesin. Jika dilakukan pengamatan khusus pada satu telur yang dipilih secara acak, berapakah peluang telur tersebut akan menetas dalam 10 hari ke depan?",o:["3/20","1/15","1/10","1/8"],a:0,e:"Total telur 20 + 35 + 30 + 15 = 100. Menetas dalam 10 hari ke depan berarti usianya sekarang minimal 18 − 10 = 8 hari, yaitu telur berusia 8 hari: 15 butir. Peluangnya 15/100 = 3/20."},
{t:"pk",k:3,q:"Seorang guru menyiapkan sejumlah kertas soal ujian yang digulung dan dimasukkan ke dalam sebuah kotak. Setiap kertas berisi kode soal A, B, atau C. Diketahui bahwa jumlah kertas berkode A lebih sedikit daripada kertas berkode B. Guru kemudian mengambil 3 kertas dengan kode yang sama dari dalam kotak. Setelah pengambilan, jumlah seluruh kertas yang tersisa di dalam kotak menjadi 28 lembar dan jumlah kertas berkode B lebih banyak daripada kertas berkode C. Jika kemudian diambil satu kertas secara acak dari kotak tersebut, diketahui bahwa peluang terambilnya kertas berkode C yaitu 2/7. Berdasarkan informasi tersebut, berapakah kemungkinan jumlah kertas soal ujian kode B mula-mula? Pilihlah semua jawaban benar! Jawaban benar lebih dari satu.",o:["10 lembar","11 lembar","12 lembar","14 lembar"],a:[1,2,3],e:"Setelah diambil 3 kertas, tersisa 28 lembar, jadi mula-mula ada 31 lembar. Peluang C = 2/7 dari 28 berarti C tersisa 8 lembar. Jika 3 kertas yang diambil berkode A: A + B = 23 dengan A &lt; B, maka B ≥ 12. Jika yang diambil berkode B: B − 3 &gt; 8, maka B ≥ 12. Jika yang diambil berkode C: C mula-mula 11, A + B = 20 dengan A &lt; B, maka B = 11 mungkin. Jadi B bisa 11, 12, atau 14; B = 10 tidak mungkin dalam semua kasus."},
];
var N=Q.length,A,F,cur,left,iv,nama,DUR=75*60,L="ABCD";
var $=function(i){return document.getElementById(i)};
function done(i){var a=A[i];return Q[i].t=="pg"?a!==null:Q[i].t=="pk"?a.length>0:a.every(function(x){return x!==null})}
function start(){
 nama=$("nm").value.trim();if(!nama){$("nm").focus();$("er").textContent="Isi nama peserta terlebih dahulu.";return}
 A=Q.map(function(q){return q.t=="pg"?null:q.t=="pk"?[]:q.s.map(function(){return null})});
 F=Q.map(function(){return false});cur=0;left=DUR;
 $("tm").classList.remove("hide");tick();iv=setInterval(tick,1000);draw();
}
function tick(){
 var m=Math.floor(left/60),s=left%60;var e=$("tm");e.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
 e.classList.toggle("low",left<=300);
 if(left<=0){finish();return}left--;
}
function home(){
 $("app").innerHTML='<div class="card"><h1>Soal TKA Matematika SMP 2025</h1><p class="mut">Soal asli TKA Matematika SMP 2025 (30 soal) dalam format ujian berbasis komputer: bilangan, aljabar, geometri dan pengukuran, serta data dan peluang. Pembahasan setiap soal ditampilkan setelah jawaban dikumpulkan. Sumber soal: m4th-lab.net. Soal latihan ini bukan halaman resmi Pusmendik/Kemendikdasmen.</p>'+
 '<table class="tb"><tr><th>Jumlah soal</th><td>'+N+' soal</td></tr><tr><th>Waktu</th><td>75 menit</td></tr><tr><th>Bentuk soal</th><td>Pilihan ganda sederhana, pilihan ganda kompleks, dan pilihan ganda kompleks kategori (benar/salah)</td></tr></table>'+
 '<p style="margin-top:18px"><label for="nm"><b>Nama peserta</b></label><input id="nm" type="text" autocomplete="name" placeholder="Tulis nama lengkap"></p><p id="er" class="no" style="margin:4px 0"></p><button class="p" onclick="start()">Mulai ujian</button></div>';
}
function draw(){
 var q=Q[cur],h='';
 h+='<div class="grid"><div class="card"><div class="meta"><span class="chip">Soal '+(cur+1)+' dari '+N+'</span><span class="chip">'+T[q.k]+'</span></div>';
 if(q.r)h+='<div class="rd">'+B[q.r]+'</div>';
 h+='<p class="hint">'+(q.t=="pg"?"Pilih satu jawaban yang benar.":q.t=="pk"?"Pilih lebih dari satu jawaban yang benar.":"Tentukan pilihan yang sesuai untuk setiap pernyataan.")+'</p>';
 h+='<p class="q">'+q.q+'</p>';
 if(q.t=="kat"){
  h+='<table class="k"><tr><th>Pernyataan</th><th class="c">'+(q.c||CB)[0]+'</th><th class="c">'+(q.c||CB)[1]+'</th></tr>';
  q.s.forEach(function(s,i){h+='<tr><td>'+s+'</td><td class="c"><input type="radio" name="s'+i+'" aria-label="'+(q.c||CB)[0]+'" '+(A[cur][i]===true?"checked":"")+' onchange="setK('+i+',true)"></td><td class="c"><input type="radio" name="s'+i+'" aria-label="'+(q.c||CB)[1]+'" '+(A[cur][i]===false?"checked":"")+' onchange="setK('+i+',false)"></td></tr>'});
  h+='</table>';
 }else{
  q.o.forEach(function(o,i){var on=q.t=="pg"?A[cur]===i:A[cur].indexOf(i)>-1;
   h+='<label class="opt'+(on?" sel":"")+'"><input type="'+(q.t=="pg"?"radio":"checkbox")+'" name="o" '+(on?"checked":"")+' onchange="setO('+i+')"><b>'+L[i]+'.</b><span>'+o+'</span></label>'});
 }
 h+='<div class="bar"><button '+(cur==0?"disabled":"")+' onclick="go(cur-1)">Sebelumnya</button>'+
 '<label class="flag"><input type="checkbox" '+(F[cur]?"checked":"")+' onchange="F[cur]=this.checked;nav()">Ragu-ragu</label>'+
 (cur<N-1?'<button class="p" onclick="go(cur+1)">Berikutnya</button>':'<button class="p" onclick="ask()">Selesai</button>')+'</div></div>';
 h+='<div class="card"><h2>Daftar soal</h2><div class="nav" id="nv"></div><div class="leg"><span><i style="background:var(--ok)"></i>Sudah dijawab</span><span><i style="background:var(--flag)"></i>Ragu-ragu</span><span><i></i>Belum dijawab</span></div><div class="bar"><button class="p" style="width:100%" onclick="ask()">Kumpulkan jawaban</button></div></div></div>';
 $("app").innerHTML=h;nav();
}
function nav(){
 $("nv").innerHTML=Q.map(function(q,i){return '<button class="'+(F[i]?"f":done(i)?"a":"")+(i==cur?" cur":"")+'" onclick="go('+i+')" aria-label="Soal '+(i+1)+'">'+(i+1)+'</button>'}).join("");
}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function setO(i){var q=Q[cur];if(q.t=="pg")A[cur]=i;else{var p=A[cur].indexOf(i);p>-1?A[cur].splice(p,1):A[cur].push(i)}draw()}
function setK(i,v){A[cur][i]=v;nav()}
function ask(){
 var u=Q.filter(function(q,i){return !done(i)}).length,f=F.filter(Boolean).length;
 var m=document.createElement("div");m.className="modal";m.id="md";
 m.innerHTML='<div class="card"><h2>Kumpulkan jawaban?</h2><p>Belum dijawab: <b>'+u+'</b> soal. Ditandai ragu-ragu: <b>'+f+'</b> soal.</p><p class="mut">Setelah dikumpulkan, jawaban tidak dapat diubah.</p><div class="bar"><button onclick="$(\'md\').remove()">Kembali</button><button class="p" onclick="finish()">Ya, kumpulkan</button></div></div>';
 document.body.appendChild(m);
}
function sc(i){var q=Q[i],a=A[i];
 if(q.t=="pg")return a===q.a?1:0;
 if(q.t=="pk"){var c=q.a.filter(function(x){return a.indexOf(x)>-1}).length,w=a.length-c;return Math.max(0,(c-w)/q.a.length)}
 return q.a.filter(function(v,j){return a[j]===v}).length/q.a.length}
function show(i){var q=Q[i],a=A[i];
 if(q.t=="pg")return a===null?"Kosong":L[a];
 if(q.t=="pk")return a.length?a.slice().sort().map(function(x){return L[x]}).join(", "):"Kosong";
 return a.map(function(x){return x===null?"–":x?(q.c||CB)[0]:(q.c||CB)[1]}).join(" / ")}
function key(i){var q=Q[i];
 if(q.t=="pg")return L[q.a];
 if(q.t=="pk")return q.a.map(function(x){return L[x]}).join(", ");
 return q.a.map(function(x){return x?(q.c||CB)[0]:(q.c||CB)[1]}).join(" / ")}
function finish(){
 clearInterval(iv);var md=$("md");if(md)md.remove();$("tm").classList.add("hide");
 var tot=0,per=T.map(function(){return [0,0]});
 Q.forEach(function(q,i){var s=sc(i);tot+=s;per[q.k][0]+=s;per[q.k][1]++});
 var nilai=Math.round(tot/N*100);
 var h='<div class="card"><h1>Hasil ujian</h1><p class="mut">'+nama.replace(/</g,"&lt;")+'</p><div class="score">'+nilai+'</div><p>Skor dari 100. Soal benar penuh: '+Q.filter(function(q,i){return sc(i)==1}).length+' dari '+N+'.</p>'+
 '<table class="tb"><tr><th>Materi</th><th>Skor</th></tr>'+per.map(function(p,i){return '<tr><td>'+T[i]+'</td><td>'+(Math.round(p[0]*10)/10)+' / '+p[1]+'</td></tr>'}).join("")+'</table>'+
 '<p style="margin-top:16px"><button class="p" onclick="home()">Ulangi dari awal</button></p></div><div class="card" style="margin-top:16px"><h2>Pembahasan</h2>';
 Q.forEach(function(q,i){var s=sc(i);
  h+='<div class="rev"><div class="meta"><span class="chip">Soal '+(i+1)+'</span><span class="chip">'+T[q.k]+'</span><span class="'+(s==1?"ok":"no")+'">'+(s==1?"Benar":s>0?"Benar sebagian":"Salah")+'</span></div>'+(q.r?'<div class="rd">'+B[q.r]+'</div>':'')+'<p class="q" style="font-size:17px">'+q.q+'</p>'+
  (q.s?'<ul>'+q.s.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>':'<ul style="list-style:none;padding:0">'+q.o.map(function(o,j){return '<li>'+L[j]+'. '+o+'</li>'}).join("")+'</ul>')+
  '<p>Jawabanmu: <b>'+show(i)+'</b> · Kunci: <b>'+key(i)+'</b></p><div class="exp">'+q.e+'</div></div>'});
 h+='</div>';$("app").innerHTML=h;window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
